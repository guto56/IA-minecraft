<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CraftBot · Minecraft Java %VITE_MC_VERSION%</title>
    <meta name="description" content="Receitas, farms, drops, poções e dicas do Minecraft Java %VITE_MC_VERSION%, direto dos arquivos do jogo. Sem IA." />
    <meta name="theme-color" content="#141517" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-192.png" />
    <link rel="preload" as="image" href="/icons/ui-32.png" />
    <script>
      try {
        const t = localStorage.getItem('craftbot-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
